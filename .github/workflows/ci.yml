name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cloudlocksmith
          POSTGRES_PASSWORD: cloudlocksmith
          POSTGRES_DB: cloudlocksmith_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudlocksmith -d cloudlocksmith_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Placeholder settings for tests only; nothing here is a real credential.
      DATABASE_URL: postgresql://cloudlocksmith:cloudlocksmith@localhost:5432/cloudlocksmith_test
      BACKEND_PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      MICROSOFT_CLIENT_ID: ci-placeholder
      MICROSOFT_CLIENT_SECRET: ci-placeholder
      MICROSOFT_REDIRECT_URI: http://localhost:8000/api/v1/auth/microsoft/callback
      SESSION_SECRET: ci-placeholder
      APP_JWT_SECRET: ci-placeholder
      ENCRYPTION_KEY: ZGVtby1tb2RlLW9ubHktbm90LWEtc2VjcmV0LWtleSE=
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrate the test database
        run: alembic upgrade head
      - name: Tests (unit + Postgres integration)
        run: pytest -q

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx jest --ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (working tree and full history)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  demo-smoke:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo stack
        run: docker compose up --build -d
      - name: Sign in to the demo and read the risk feed
        run: |
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8000/docs && break; sleep 3; done
          curl -fs -c cookies.txt -X POST -H "Origin: http://localhost:3000" http://127.0.0.1:8000/api/v1/demo/login
          curl -fs -b cookies.txt -H "X-Tenant-ID: 00000000-0000-4000-8000-00000000de30" \
            http://127.0.0.1:8000/api/v1/risk-feed > /dev/null
          # A write must be refused in demo mode.
          code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt -X POST \
            -H "Origin: http://localhost:3000" -H "X-Tenant-ID: 00000000-0000-4000-8000-00000000de30" \
            http://127.0.0.1:8000/api/v1/remediation/execute/1)
          test "$code" = "403"
          curl -fs -o /dev/null http://127.0.0.1:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
