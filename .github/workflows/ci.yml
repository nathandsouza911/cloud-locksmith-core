name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cloudlocksmith
          POSTGRES_PASSWORD: cloudlocksmith
          POSTGRES_DB: cloudlocksmith_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cloudlocksmith -d cloudlocksmith_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Placeholder settings for tests only; nothing here is a real credential.
      DATABASE_URL: postgresql://cloudlocksmith:cloudlocksmith@localhost:5432/cloudlocksmith_test
      BACKEND_PUBLIC_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      MICROSOFT_CLIENT_ID: ci-placeholder
      MICROSOFT_CLIENT_SECRET: ci-placeholder
      MICROSOFT_REDIRECT_URI: http://localhost:8000/api/v1/auth/microsoft/callback
      SESSION_SECRET: ci-placeholder
      APP_JWT_SECRET: ci-placeholder
      ENCRYPTION_KEY: ZGVtby1tb2RlLW9ubHktbm90LWEtc2VjcmV0LWtleSE=
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Install Pango (real PDF render test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0
      - name: Migrate the test database
        run: alembic upgrade head
      - name: Tests (unit + Postgres integration)
        env:
          # The evidence PDF test must render, not skip, in CI.
          REQUIRE_PDF_RENDER: "1"
        run: pytest -q

  setup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest cryptography ruff==0.6.9
      - name: Lint
        run: ruff check deploy/setup && ruff format --check deploy/setup
      - run: pytest -q deploy/setup/tests

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npx jest --ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (working tree and full history)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  demo-smoke:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Start the demo stack
        run: docker compose up --build -d
      - name: Sign in to the demo and read the risk feed
        run: |
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8000/docs && break; sleep 3; done
          curl -fs -c cookies.txt -X POST -H "Origin: http://localhost:3000" http://127.0.0.1:8000/api/v1/demo/login
          curl -fs -b cookies.txt -H "X-Tenant-ID: 00000000-0000-4000-8000-00000000de30" \
            http://127.0.0.1:8000/api/v1/risk-feed > /dev/null
          # A write must be refused in demo mode.
          code=$(curl -s -o /dev/null -w "%{http_code}" -b cookies.txt -X POST \
            -H "Origin: http://localhost:3000" -H "X-Tenant-ID: 00000000-0000-4000-8000-00000000de30" \
            http://127.0.0.1:8000/api/v1/remediation/execute/1)
          test "$code" = "403"
          curl -fs -o /dev/null http://127.0.0.1:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  deploy-smoke:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder config (no Microsoft sign-in; placeholder app IDs)
        run: |
          python3 -c "
          import sys; from pathlib import Path
          sys.path[:0] = ['deploy/setup', 'backend/app/services']
          import cl_setup as s
          config = s.build_config(
              tenant_id='00000000-0000-4000-8000-000000000001', client_id='00000000-0000-4000-8000-000000000002',
              client_secret='placeholder', secret_key_id='00000000-0000-4000-8000-000000000003',
              secret_expires='2028-11-18T00:00:00Z', local=s.generate_local_secrets())
          s.write_config(Path('deploy/cloud-locksmith-db.env'), s.db_env(config))
          s.write_config(Path('deploy/cloud-locksmith.env'), config)
          "
      - name: Start the local-install stack
        run: docker compose -f deploy/compose.yml up --build -d
      - name: Production mode on loopback, dashboard up, ports on 127.0.0.1 only
        run: |
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:8000/docs && break; sleep 3; done
          # No HTTPS redirect (LOCAL_LOOPBACK_ONLY) and no HSTS header.
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/docs)
          test "$code" = "200"
          headers=$(curl -s -D - -o /dev/null http://127.0.0.1:8000/docs)
          if grep -qi '^strict-transport-security' <<<"$headers"; then
            echo "HSTS header present"; exit 1
          fi
          # Production mode, loopback-only, not the demo (prints no secret).
          mode=$(docker compose -f deploy/compose.yml exec -T api printenv ENVIRONMENT LOCAL_LOOPBACK_ONLY DEMO_MODE | xargs)
          echo "$mode"
          test "$mode" = "production true false"
          for i in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:3000/login && break; sleep 2; done
          curl -fs -o /dev/null http://127.0.0.1:3000/login
          ports=$(docker compose -f deploy/compose.yml ps --format '{{.Ports}}')
          echo "$ports"
          if echo "$ports" | grep -oE '[^ ,]+->' | grep -v '^127\.0\.0\.1:'; then
            echo "a port is published on an address other than 127.0.0.1"; exit 1
          fi
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.yml down -v
