[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["alembic/versions/20261110_baseline_schema.sql"]

[tool.ruff.lint]
# Default rule set: pyflakes (F) plus the pycodestyle error subset (E4, E7, E9).
select = ["E4", "E7", "E9", "F"]
# E402: main.py registers routers in a deliberate order and several tests set
# environment variables before importing the app, so late imports are intentional.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
# Model modules are imported for their side effect of registering tables.
"app/db/models/__init__.py" = ["F401"]
"alembic/env.py" = ["F401"]
